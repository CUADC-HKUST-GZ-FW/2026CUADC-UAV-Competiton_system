recon_geolocator:
  ros__parameters:
    manifest_path: /home/nx163/youth-vision-runtime/overlays/latest_crops/manifest_fast.json
    frame_source_path: /home/nx163/youth-vision-runtime/overlays/latest.jpg
    output_root: /home/nx163/youth-vision-runtime/recon_results/current
    # Poll above the 60 FPS vision rate so every target-frame manifest can be consumed.
    manifest_poll_hz: 120.0
    result_write_hz: 20.0
    snapshot_write_hz: 5.0

    # Checkerboard calibration for the 6 mm lens at 1440 x 1080.
    # 47 of 73 images valid; RMS 0.094184 px; mean per-view 0.077804 px.
    calibration_valid: true
    calibration_width: 1440
    calibration_height: 1080
    fx: 1827.52061066
    fy: 1838.51023114
    cx: 758.72082983
    cy: 554.21732693
    distortion: [-0.06069567773, 0.1550877485, -0.001554175908, -0.00008250286962, 0.06716819185]

    # Image top points toward the aircraft nose. The optical axis is 70 degrees
    # below horizontal, equivalent to 20 degrees forward from vertical-down.
    camera_forward_tilt_deg: 20.0
    camera_left_tilt_deg: 0.0
    # Camera origin relative to the FCU body origin: forward, left, up in metres.
    camera_offset_flu_m: [0.418, 0.0, -0.09]

    # home_relative estimates a flat field MSL altitude as global_alt - relative_alt.
    # fixed_msl is preferred after surveying the operating field.
    ground_altitude_mode: home_relative
    fixed_ground_altitude_msl_m: 0.0

    # Keep RTK global data as the 5-10 Hz absolute anchor. Propagate each frame
    # from that anchor with the MAVROS ENU local EKF position; velocity is used
    # for cubic Hermite interpolation between local-position samples.
    configure_mavlink_rates: true
    global_position_rate_hz: 10.0
    local_position_rate_hz: 60.0
    attitude_stream_rate_hz: 60
    mavlink_rate_retry_sec: 30.0
    position_solution_mode: rtk_anchor_local_delta
    local_velocity_topic: /mavros/local_position/velocity_local
    global_anchor_max_age_sec: 0.35
    local_position_max_gap_sec: 0.12
    local_velocity_max_gap_sec: 0.12
    local_delta_max_speed_mps: 80.0
    local_global_disagreement_max_m: 5.0
    telemetry_max_gap_sec: 0.12
    rtk_max_gap_sec: 0.35
    max_pending_manifests: 120
    rtk_fixed_min_fix_type: 6

    # Flight mode: track non-empty three-point Pose centers in image time, then
    # select the finalized label by valid-frame majority vote.
    # Association uses at most 0.10 s between detections. The surrounding group
    # closes after 0.20 s with no active track. Only reassembled tracks with at
    # least 11 unique frames can be finalized.
    tracking_mode: pixel_packets
    packet_gap_timeout_sec: 0.20
    packet_association_gap_sec: 0.10
    packet_pixel_gate_base_px: 50.0
    packet_pixel_gate_rate_px_per_sec: 1300.0
    packet_pixel_gate_max_px: 200.0
    packet_max_observations: 300
    packet_min_observations: 11
    packet_merge_distance_m: 1.5
    packet_distinct_distance_m: 10.0

    # Retained for static calibration and explicit rollback mode.
    association_radius_m: 3.0
    minimum_observations: 5
    minimum_observation_span_sec: 0.20
    minimum_label_consensus: 0.80
    single_observation_sigma_m: 0.15
    max_horizontal_radius_95_m: 6.0

    # Coordinate fusion keeps every accepted frame, but gives image-center
    # observations more influence than observations near the image boundary.
    center_weight_minimum: 0.25
    center_weight_power: 1.0
