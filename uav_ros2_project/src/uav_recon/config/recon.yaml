recon_geolocator:
  ros__parameters:
    manifest_path: /home/nx163/youth-vision-runtime/overlays/latest_crops/manifest_fast.json
    frame_source_path: /home/nx163/youth-vision-runtime/overlays/latest.jpg
    output_root: /home/nx163/youth-vision-runtime/recon_results/current
    # Poll above the 60 FPS vision rate so every target-frame manifest can be consumed.
    manifest_poll_hz: 120.0
    result_write_hz: 20.0
    snapshot_write_hz: 5.0

    # 11 x 8 checkerboard calibration for the 6 mm lens at 1440 x 1080.
    # 19 valid images; OpenCV RMS reprojection error: 0.084497612 px.
    calibration_valid: true
    calibration_width: 1440
    calibration_height: 1080
    fx: 1828.0308235733144
    fy: 1827.57772607314
    cx: 769.3836267628353
    cy: 543.4421171826395
    distortion: [-0.0859352217243637, 0.15751764323036913, -0.0006214740525721936, 0.00016255105402478186, 0.168712316803506]

    # Image top points toward the aircraft nose. Angles are measured from
    # vertical-down: positive forward and positive toward body-left.
    camera_forward_tilt_deg: 12.0
    camera_left_tilt_deg: 4.5
    # Camera origin relative to the FCU body origin: forward, left, up in metres.
    camera_offset_flu_m: [0.418, 0.0, -0.09]

    # home_relative estimates a flat field MSL altitude as global_alt - relative_alt.
    # fixed_msl is preferred after surveying the operating field.
    ground_altitude_mode: home_relative
    fixed_ground_altitude_msl_m: 0.0

    # FCU GLOBAL_POSITION_INT and EXTRA1 attitude are requested at 20 Hz.
    # Camera events wait for telemetry on both sides before interpolation.
    configure_mavlink_rates: true
    global_position_rate_hz: 20.0
    attitude_stream_rate_hz: 20
    mavlink_rate_retry_sec: 5.0
    telemetry_max_gap_sec: 0.12
    rtk_max_gap_sec: 0.35
    max_pending_manifests: 120
    rtk_fixed_min_fix_type: 6
    association_radius_m: 3.0
    minimum_observations: 5
    minimum_observation_span_sec: 0.20
    minimum_label_consensus: 0.80
    single_observation_sigma_m: 0.15
    max_horizontal_radius_95_m: 6.0

    # Coordinate fusion keeps every accepted frame, but gives image-center
    # observations more influence than observations near the image boundary.
    center_weight_minimum: 0.25
    center_weight_power: 1.0
