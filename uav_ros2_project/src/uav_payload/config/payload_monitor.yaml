payload_monitor_node:
  ros__parameters:
    enabled: true
    servo_channel: 7
    release_pwm: 1900
    pwm_tolerance_us: 20
    required_consecutive_samples: 3
    telemetry_stale_timeout_s: 1.0
    execution_timeout_s: 5.0
    status_log_period_s: 2.0
    warning_throttle_s: 5.0
    waypoint_list_topic: /mavros/mission/waypoints
    waypoint_reached_topic: /mavros/mission/reached
    rc_out_topic: /mavros/rc/out
    gps_topic: /mavros/global_position/global
    gps_stale_timeout_s: 1.0
    state_topic: /mavros/state
    task_id_topic: /mission/active_task_id
    status_topic: /payload/monitor/status
